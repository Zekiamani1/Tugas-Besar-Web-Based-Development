receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318
processors:
  batch:
exporters:
  otlp_http/traces:
    endpoint: http://127.0.0.1:4418
  otlp_http/logs:
    endpoint: http://127.0.0.1:3100/otlp
  otlp_http/metrics:
    endpoint: http://127.0.0.1:9090/api/v1/otlp
  prometheus:
    endpoint: 0.0.0.0:9464
    resource_to_telemetry_conversion:
      enabled: true
extensions:
  health_check:
    endpoint: 0.0.0.0:13133
service:
  extensions: [health_check]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp_http/traces]
    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp_http/logs]
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp_http/metrics, prometheus]
