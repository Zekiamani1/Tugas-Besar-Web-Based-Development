<!DOCTYPE html>
<html>
<head><title>Dashboard</title></head>
<body>
	<h1>Dashboard</h1>
	<nav>
		<a href="/admin">Admin Panel</a>
		<form method="POST" action="/logout">
			<button type="submit">Logout</button>
		</form>
	</nav>

	<h2>Databases</h2>
	<ul>
	{{range .Databases}}
		<li>
			<a href="/databases/{{.ID}}/schemas">{{.Name}}</a> ({{.DBType}} - {{.Host}}:{{.Port}}/{{.DBName}})
		</li>
	{{end}}
	</ul>
</body>
</html>
