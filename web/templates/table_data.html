<!DOCTYPE html>
<html lang="id">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Table Data · Database Manager</title><link rel="stylesheet" href="/static/app.css"></head>
<body>
	<main class="page"><header class="page-header"><div><p class="eyebrow">Table Data</p><h1>{{.Schema}}.{{.TableName}}</h1></div><nav>
		<a href="/databases/{{.DBID}}/schemas/{{.Schema}}/tables/{{.TableName}}">Table Details</a>
		<a href="/databases/{{.DBID}}/schemas/{{.Schema}}/tables">Back to Tables</a>
	</nav></header>
	<section class="card">
	{{if .Rows}}<div class="table-wrap"><table><thead><tr>{{range .Columns}}<th scope="col">{{.}}</th>{{end}}</tr></thead><tbody>
	{{range .Rows}}
		{{$row := .}}<tr>{{range $.Columns}}<td>{{index $row .}}</td>{{end}}</tr>
	{{end}}
	</tbody></table></div>{{else}}<p class="empty-state">Belum ada data pada tabel ini.</p>{{end}}
	</section></main>
</body>
</html>
