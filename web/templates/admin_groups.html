<!DOCTYPE html>
<html lang="id">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Groups · Admin</title>
	<link rel="stylesheet" href="/static/app.css">
</head>
<body>
	<main class="page">
		<header class="page-header">
			<div><p class="eyebrow">Admin Panel</p><h1>Groups</h1></div>
			<nav><a href="/admin">Admin Panel</a><a href="/admin/users">Users</a><a href="/admin/databases">Databases</a></nav>
		</header>
		<section class="card">
			<h2>Group list</h2>
			{{if .Groups}}
			<div class="table-wrap"><table>
				<thead><tr><th scope="col">ID</th><th scope="col">Name</th></tr></thead>
				<tbody>{{range .Groups}}<tr><td>{{.ID}}</td><td>{{.Name}}</td></tr>{{end}}</tbody>
			</table></div>
			{{else}}<p class="empty-state">Belum ada group.</p>{{end}}
		</section>
	</main>
</body>
</html>
