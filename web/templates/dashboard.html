<!DOCTYPE html>
<html>
<head><title>Dashboard</title></head>
<body>
	<h1>Dashboard</h1>
	<nav>
		{{if .IsAdmin}}
		<a href="/admin">Admin Panel</a>
		{{end}}
		<form method="POST" action="/logout">
			<button type="submit">Logout</button>
		</form>
	</nav>

	<h2>Databases</h2>
	<ul>
	{{range .Databases}}
		<li>
			<strong><a href="/databases/{{.ID}}/schemas">{{.Name}}</a></strong> ({{.DBType}} - {{.Host}}:{{.Port}}/{{.DBName}})
			| <a href="/databases/{{.ID}}/migrations">Migrations</a>
		</li>
	{{else}}
		<li>No databases available for your account.</li>
	{{end}}
	</ul>
</body>
</html>
