<!DOCTYPE html>
<html lang="id">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Tables · Database Manager</title><link rel="stylesheet" href="/static/app.css"></head>
<body>
	<main class="page"><header class="page-header"><div><p class="eyebrow">Database #{{.DBID}} · {{.Schema}}</p><h1>Tables</h1></div><nav><a href="/databases/{{.DBID}}/schemas">Back to Schemas</a><a href="/dashboard">Dashboard</a></nav></header>
	<section class="card"><ul class="item-list">
	{{range .Tables}}
		<li>
			<a href="/databases/{{$.DBID}}/schemas/{{$.Schema}}/tables/{{.}}">{{.}}</a>
			(<a href="/databases/{{$.DBID}}/schemas/{{$.Schema}}/tables/{{.}}/data">Data</a>)
		</li>
	{{else}}
		<li class="empty-state">Belum ada tabel dalam schema ini.</li>
	{{end}}
	</ul></section></main>
</body>
</html>
