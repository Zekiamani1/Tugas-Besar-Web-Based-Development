<!DOCTYPE html>
<html>
<head><title>Tables</title></head>
<body>
	<h1>Tables in {{.Schema}}</h1>
	<a href="/databases/{{.DBID}}/schemas">Back to Schemas</a>
	<ul>
	{{range .Tables}}
		<li>
			<a href="/databases/{{$.DBID}}/schemas/{{$.Schema}}/tables/{{.}}">{{.}}</a>
			(<a href="/databases/{{$.DBID}}/schemas/{{$.Schema}}/tables/{{.}}/data">Data</a>)
		</li>
	{{end}}
	</ul>
</body>
</html>
